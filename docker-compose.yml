services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: filestorage-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/FileStorage.Api/Dockerfile
    container_name: filestorage-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=FileStorageDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-file-storage-service}
      Jwt__Audience: ${JWT_AUDIENCE:-file-storage-clients}
      Jwt__EnableMockTokenEndpoint: ${ENABLE_MOCK_TOKEN_ENDPOINT:-true}
      Storage__RootPath: /app/_storage
      Database__AutoMigrate: "true"
      Cors__AllowedOrigin: ""
    volumes:
      - storage_data:/app/_storage
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: filestorage-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  storage_data:
